<svg width="1280" height="460" viewBox="0 0 1280 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-variant-numeric="tabular-nums">
  <defs>
    <radialGradient id="auraTL" cx="12%" cy="8%" r="72%">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.20"/>
      <stop offset="42%" stop-color="#4ec9b0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraBR" cx="98%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#ff4081" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ascentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4ec9b0" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="#4ec9b0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4ec9b0" stop-opacity="0.35"/>
      <stop offset="55%"  stop-color="#4ec9b0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1280" height="460" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">

    <!-- background -->
    <rect width="1280" height="460" fill="#0a0d11"/>
    <rect width="1280" height="460" fill="url(#auraTL)"/>
    <rect width="1280" height="460" fill="url(#auraBR)"/>

    <!-- ================= HEADER ================= -->
    <text x="48" y="46" font-size="11.5" font-weight="700" letter-spacing="3.2" fill="#4ec9b0">RANKS</text>
    <text x="48" y="86" font-size="26" font-weight="800" letter-spacing="-0.6" fill="#eef1f5">From Novice to Godlike.</text>

    <text x="1232" y="46" font-size="11.5" font-weight="700" letter-spacing="2.6" text-anchor="end" fill="#4ec9b0">EARN YOURS</text>
    <text x="1232" y="86" font-size="13" font-weight="500" text-anchor="end" fill="#8a8f98">27 tiers · LV 1 → 150</text>

    <!-- ================= BASELINE ================= -->
    <line x1="48" y1="380" x2="1232" y2="380" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- ================= AREA FILL ================= -->
    <path d="M 68 375 C 400 375 900 350 1212 180 L 1212 380 L 68 380 Z"
          fill="url(#ascentFill)"/>

    <!-- ================= ASCENT CURVE ================= -->
    <path d="M 68 375 C 400 375 900 350 1212 180"
          fill="none" stroke="url(#curveGrad)" stroke-width="2.4"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- ================= 7 ТОЧЕК ================= -->
    <g filter="url(#dotGlow)">
      <circle cx="68"   cy="375" r="5" fill="#8b8b8b"/>
      <circle cx="246"  cy="372" r="5" fill="#2196f3"/>
      <circle cx="443"  cy="362" r="5" fill="#9c27b0"/>
      <circle cx="648"  cy="341" r="5" fill="#ff9800"/>
      <circle cx="851"  cy="306" r="5" fill="#00bcd4"/>
      <circle cx="1042" cy="253" r="5" fill="#ffea00"/>
      <circle cx="1212" cy="180" r="5" fill="#ffffff"/>
    </g>

    <!-- ================= LABELS ================= -->
    <g font-size="11" font-weight="600" fill="#eef1f5" text-anchor="middle">
      <text x="68"   y="408">Novice</text>
      <text x="246"  y="408">Developer</text>
      <text x="443"  y="408">Engineer</text>
      <text x="648"  y="408">Wizard</text>
      <text x="851"  y="408">Mythic</text>
      <text x="1042" y="408">Omnipotent</text>
      <text x="1212" y="408">Godlike</text>
    </g>

    <g font-size="9" font-weight="700" letter-spacing="1.6" fill="#8a8f98" text-anchor="middle">
      <text x="68"   y="424">LV 1</text>
      <text x="246"  y="424">LV 9</text>
      <text x="443"  y="424">LV 12</text>
      <text x="648"  y="424">LV 40</text>
      <text x="851"  y="424">LV 60</text>
      <text x="1042" y="424">LV 120</text>
      <text x="1212" y="424">LV 150</text>
    </g>

  </g>

  <!-- outer border (поверх, по скруглённому контуру) -->
  <rect x="0.5" y="0.5" width="1279" height="459" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
</svg>