      <rect x="996" y="258" width="96" height="68" rx="8" fill="#161b22" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="1008" y="278" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#8a8f98">FILES</text>
      <text x="1008" y="306" font-size="15" font-weight="700" fill="#eef1f5">538</text>

      <rect x="1100" y="258" width="96" height="68" rx="8" fill="#161b22" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="1112" y="278" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#8a8f98">LANGUAGES</text>
      <text x="1112" y="306" font-size="15" font-weight="700" fill="#eef1f5">20</text>

      <!-- ============ CHART CARD ============ -->
      <rect x="580" y="338" width="616" height="156" rx="10" fill="#161b22" stroke="#ffffff" stroke-opacity="0.06"/>

      <text x="604" y="364" font-size="9" font-weight="700" letter-spacing="2" fill="#8a8f98">HOUR OF DAY</text>
      <text x="1172" y="364" font-size="9" font-weight="600" text-anchor="end" fill="#8a8f98">Peak: 16:00</text>

      <g>
        <rect x="605"  y="467.6" width="14" height="6.4"  rx="2" fill="url(#barGrad)"/>
        <rect x="629"  y="469.7" width="14" height="4.3"  rx="2" fill="url(#barGrad)"/>
        <rect x="653"  y="471.9" width="14" height="2.1"  rx="2" fill="url(#barGrad)"/>
        <rect x="677"  y="471.9" width="14" height="2.1"  rx="2" fill="url(#barGrad)"/>
        <rect x="701"  y="471.9" width="14" height="2.1"  rx="2" fill="url(#barGrad)"/>
        <rect x="725"  y="469.7" width="14" height="4.3"  rx="2" fill="url(#barGrad)"/>
        <rect x="749"  y="463.3" width="14" height="10.7" rx="2" fill="url(#barGrad)"/>
        <rect x="773"  y="448.3" width="14" height="25.7" rx="2" fill="url(#barGrad)"/>
        <rect x="797"  y="431.1" width="14" height="42.9" rx="2" fill="url(#barGrad)"/>
        <rect x="821"  y="414.0" width="14" height="60.0" rx="2" fill="url(#barGrad)"/>
        <rect x="845"  y="405.4" width="14" height="68.6" rx="2" fill="url(#barGrad)"/>
        <rect x="869"  y="418.3" width="14" height="55.7" rx="2" fill="url(#barGrad)"/>
        <rect x="893"  y="435.4" width="14" height="38.6" rx="2" fill="url(#barGrad)"/>
        <rect x="917"  y="444.0" width="14" height="30.0" rx="2" fill="url(#barGrad)"/>
        <rect x="941"  y="422.6" width="14" height="51.4" rx="2" fill="url(#barGrad)"/>
        <rect x="965"  y="392.6" width="14" height="81.4" rx="2" fill="url(#barGrad)"/>
        <rect x="989"  y="384.0" width="14" height="90.0" rx="2" fill="url(#barWarm)"/>
        <rect x="1013" y="396.9" width="14" height="77.1" rx="2" fill="url(#barGrad)"/>
        <rect x="1037" y="418.3" width="14" height="55.7" rx="2" fill="url(#barGrad)"/>
        <rect x="1061" y="426.9" width="14" height="47.1" rx="2" fill="url(#barGrad)"/>
        <rect x="1085" y="435.4" width="14" height="38.6" rx="2" fill="url(#barGrad)"/>
        <rect x="1109" y="444.0" width="14" height="30.0" rx="2" fill="url(#barGrad)"/>
        <rect x="1133" y="452.6" width="14" height="21.4" rx="2" fill="url(#barGrad)"/>
        <rect x="1157" y="461.1" width="14" height="12.9" rx="2" fill="url(#barGrad)"/>
      </g>

      <g font-size="7.5" font-weight="500" fill="#6b7280" text-anchor="middle">
        <text x="612"  y="486">00</text>
        <text x="684"  y="486">03</text>
        <text x="756"  y="486">06</text>
        <text x="828"  y="486">09</text>
        <text x="900"  y="486">12</text>
        <text x="972"  y="486">15</text>
        <text x="1044" y="486">18</text>
        <text x="1116" y="486">21</text>
      </g>

      <!-- ============ ACHIEVEMENTS ROW ============ -->
      <rect x="580" y="506" width="616" height="44" rx="10" fill="#161b22" stroke="#ffffff" stroke-opacity="0.06"/>

      <text x="604" y="533" font-size="9" font-weight="700" letter-spacing="2" fill="#8a8f98">ACHIEVEMENTS</text>

      <circle cx="804" cy="528" r="5" fill="#4ec9b0" fill-opacity="0.9"/>
      <circle cx="828" cy="528" r="5" fill="#4ec9b0" fill-opacity="0.9"/>
      <circle cx="852" cy="528" r="5" fill="#4ec9b0" fill-opacity="0.9"/>
      <circle cx="876" cy="528" r="5" fill="#4ec9b0" fill-opacity="0.9"/>
      <circle cx="900" cy="528" r="5" fill="#4ec9b0" fill-opacity="0.9"/>
      <circle cx="924" cy="528" r="5" fill="#4ec9b0" fill-opacity="0.9"/>
      <circle cx="948" cy="528" r="5" fill="#4ec9b0" fill-opacity="0.9"/>
      <circle cx="972" cy="528" r="5" fill="#4ec9b0" fill-opacity="0.9" filter="url(#dotGlow)"/>

      <text x="1172" y="533" font-size="11" font-weight="700" text-anchor="end" fill="#4ec9b0">15 / 15</text>
    </g>

  </g>

  <!-- outer border (по скруглённому контуру карточки) -->
