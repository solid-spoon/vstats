<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-variant-numeric="tabular-nums">
  <defs>
    <radialGradient id="auraTL" cx="12%" cy="8%" r="72%">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.26"/>
      <stop offset="42%" stop-color="#4ec9b0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraBR" cx="98%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#0e639c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0e639c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#a8f4dc"/>
      <stop offset="100%" stop-color="#4ec9b0"/>
    </linearGradient>
    <linearGradient id="xpGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cffd1"/>
      <stop offset="100%" stop-color="#4ec9b0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e639c" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="barWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd28a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="winGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="winClip">
      <rect x="560" y="70" width="656" height="500" rx="12"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1280" height="640" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">

    <!-- ============ BACKGROUND ============ -->
    <rect width="1280" height="640" fill="#0a0d11"/>
    <rect width="1280" height="640" fill="url(#auraTL)"/>
    <rect width="1280" height="640" fill="url(#auraBR)"/>

    <!-- ============ LEFT COLUMN ============ -->
    <text x="64" y="176" font-size="12" font-weight="700" letter-spacing="6" fill="#4ec9b0">VSTATS</text>

    <text x="64" y="248" font-size="68" font-weight="800" letter-spacing="-2.4" fill="#eef1f5">Level up</text>
    <text x="64" y="326" font-size="68" font-weight="800" letter-spacing="-2.4" fill="url(#textGrad)">your code.</text>

    <text x="64" y="388" font-size="16" font-weight="500" fill="#8a8f98">Gamified coding stats for VSCodium.</text>
    <text x="64" y="412" font-size="16" font-weight="500" fill="#8a8f98">Track every keystroke. Level up every save.</text>

    <!-- badges (компактные, 12px gap) -->
    <g transform="translate(64, 452)">
      <rect width="112" height="34" rx="17" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="20" cy="17" r="3.5" fill="#4ec9b0" filter="url(#dotGlow)"/>
      <text x="34" y="22" font-size="13" font-weight="700" fill="#eef1f5">Lv. 133</text>
    </g>
    <g transform="translate(188, 452)">
      <rect width="152" height="34" rx="17" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="20" cy="17" r="3.5" fill="#4ec9b0" filter="url(#dotGlow)"/>
      <text x="34" y="22" font-size="13" font-weight="700" fill="#eef1f5">24,874h tracked</text>
    </g>
    <g transform="translate(352, 452)">
      <rect width="128" height="34" rx="17" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="20" cy="17" r="3.5" fill="#ffb454" filter="url(#dotGlow)"/>
      <text x="34" y="22" font-size="13" font-weight="700" fill="#eef1f5">100d streak</text>
    </g>

    <!-- github link (поднят с 570 до 555) -->
    <text x="64" y="555" font-size="11.5" font-weight="500" letter-spacing="1.5" fill="#6b7280">github.com/solid-spoon/vstats</text>

    <!-- ============ RIGHT: EDITOR WINDOW ============ -->
    <rect x="560" y="70" width="656" height="500" rx="12" fill="#4ec9b0" fill-opacity="0.30" filter="url(#winGlow)"/>

    <g clip-path="url(#winClip)">
      <rect x="560" y="70" width="656" height="500" fill="#0d1117"/>

      <!-- ============ macOS TOOLBAR ============ -->
      <rect x="560" y="70" width="656" height="36" fill="#0a0d12"/>

      <circle cx="584" cy="88" r="5.5" fill="#ff5f56"/>
      <circle cx="600" cy="88" r="5.5" fill="#ffbd2e"/>
      <circle cx="616" cy="88" r="5.5" fill="#27c93f"/>

      <rect x="728" y="77" width="320" height="22" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="888" y="92" font-size="11" font-weight="500" fill="#8a8f98" text-anchor="middle">vstats</text>

      <g stroke="#8a8f98" stroke-width="1.2" fill="none" opacity="0.75">
        <rect x="1115" y="82" width="11" height="11" rx="2"/>
        <line x1="1120.5" y1="82" x2="1120.5" y2="93"/>
      </g>
      <g stroke="#8a8f98" stroke-width="1.2" fill="none" opacity="0.55">
        <rect x="1137" y="82" width="11" height="11" rx="2"/>
