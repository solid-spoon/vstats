      <rect x="604" y="208" width="270" height="6" rx="3" fill="url(#xpGrad)"/>

      <text x="604" y="231" font-size="10" font-weight="500" fill="#8a8f98">1,748,416 XP · 20,483 to next level</text>

      <!-- streak (уменьшен 48 → 42) -->
      <text x="1172" y="193" font-size="42" font-weight="800" letter-spacing="-1.4" text-anchor="end" fill="#ffb454">10</text>
