      <rect x="580" y="126" width="616" height="120" rx="12" fill="#161b22" stroke="#ffffff" stroke-opacity="0.06"/>

      <text x="604" y="156" font-size="9" font-weight="700" letter-spacing="3" fill="#ff4081">OMNIPOTENT</text>

