        <line x1="1186.5" y1="82" x2="1186.5" y2="93"/>
        <line x1="1181" y1="87.5" x2="1192" y2="87.5"/>
      </g>

      <rect x="560" y="105" width="656" height="1" fill="#ffffff" fill-opacity="0.06"/>

