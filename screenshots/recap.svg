<svg width="1280" height="460" viewBox="0 0 1280 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-variant-numeric="tabular-nums">
  <defs>
    <radialGradient id="auraTL" cx="12%" cy="8%" r="72%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#00ADD8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraBR" cx="98%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#a8f4dc"/>
      <stop offset="100%" stop-color="#4ec9b0"/>
    </linearGradient>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1280" height="460" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">

    <!-- background -->
    <rect width="1280" height="460" fill="#0a0d11"/>
    <rect width="1280" height="460" fill="url(#auraTL)"/>
    <rect width="1280" height="460" fill="url(#auraBR)"/>

    <!-- top strip in go-blue (обрезана по радиусу карточки) -->
    <rect x="0" y="0" width="1280" height="4" fill="#00ADD8" opacity="0.7"/>

    <!-- ============ HEADER ============ -->
    <text x="48" y="72" font-size="10.5" font-weight="700" letter-spacing="3" fill="#4ec9b0">RECAP</text>
    <text x="48" y="112" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#eef1f5">October 2026</text>

    <text x="1232" y="72" font-size="10.5" font-weight="700" letter-spacing="2.4" text-anchor="end" fill="#8a8f98">ALL TIME</text>
    <text x="1232" y="112" font-size="11" font-weight="500" text-anchor="end" fill="#8a8f98">This Month · Last Month · This Year</text>

    <!-- ============ HERO ============ -->
    <text x="48" y="248" font-size="88" font-weight="800" letter-spacing="-4" fill="url(#heroGrad)">130h 31m</text>

    <g transform="translate(48, 276)">
      <rect width="176" height="30" rx="15" fill="#4ec9b0" fill-opacity="0.10" stroke="#4ec9b0" stroke-opacity="0.30"/>
      <text x="88" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4ec9b0" xml:space="preserve">↑ 12.4%<tspan dx="6" font-size="12" font-weight="500" fill="#8a8f98">vs Sep 2026</tspan></text>
    </g>

    <!-- ============ RIGHT: 2x2 STATS ============ -->
    <text x="620" y="200" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#eef1f5">84,786</text>
    <text x="620" y="218" font-size="9.5" font-weight="700" letter-spacing="2" fill="#8a8f98">SAVES</text>

    <text x="620" y="278" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#eef1f5">2,842</text>
    <text x="620" y="296" font-size="9.5" font-weight="700" letter-spacing="2" fill="#8a8f98">ACTIVE DAYS</text>

    <text x="946" y="200" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#eef1f5">68</text>
    <text x="946" y="218" font-size="9.5" font-weight="700" letter-spacing="2" fill="#8a8f98">SESSIONS</text>

    <text x="946" y="278" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#eef1f5">15.8M</text>
    <text x="946" y="296" font-size="9.5" font-weight="700" letter-spacing="2" fill="#8a8f98">KEYSTROKES</text>

    <line x1="580" y1="160" x2="580" y2="300" stroke="#ffffff" stroke-opacity="0.06"/>
    <line x1="906" y1="160" x2="906" y2="300" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- ============ BOTTOM STRIP ============ -->
    <line x1="48" y1="336" x2="1232" y2="336" stroke="#ffffff" stroke-opacity="0.06"/>

    <text x="48" y="368" font-size="9.5" font-weight="700" letter-spacing="2.2" fill="#8a8f98">TOP LANGUAGE</text>
    <circle cx="53" cy="398" r="4.5" fill="#00ADD8" filter="url(#dotGlow)"/>
    <text x="66" y="403" font-size="15" font-weight="600" fill="#eef1f5">go</text>
    <text x="96" y="403" font-size="13" font-weight="500" fill="#8a8f98">· 44h 1m</text>

    <text x="490" y="368" font-size="9.5" font-weight="700" letter-spacing="2.2" fill="#8a8f98">TOP PROJECT</text>
    <text x="490" y="403" font-size="15" font-weight="600" fill="#eef1f5">notifications-service</text>
    <text x="490" y="423" font-size="12" font-weight="500" fill="#8a8f98">10h 11m</text>

    <text x="932" y="368" font-size="9.5" font-weight="700" letter-spacing="2.2" fill="#8a8f98">BEST DAY</text>
    <text x="932" y="403" font-size="15" font-weight="600" fill="#eef1f5">Oct 11</text>
    <text x="932" y="423" font-size="12" font-weight="500" fill="#8a8f98">17h 48m</text>

  </g>

  <!-- outer border (поверх, чтобы скругление читалось) -->
  <rect x="0.5" y="0.5" width="1279" height="459" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
</svg>